# Cross-entropy control on GUIDE: the RiskFit recipe without the hinge (same backbone, sampling and SupCon).
model_type: fastfitlora
preprocessor_kwargs:
  model_name: "cisco-ai/SecureBERT2.0-biencoder"
  max_tokens: 1024
  apply_weighting: false
model_name_or_path: "cisco-ai/SecureBERT2.0-biencoder"
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.1
lora_target_modules: ["Wqkv", "Wo"]
num_train_epochs: 20  # GUIDE: 20-epoch ceiling, early stopping patience 5
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
max_text_length: 1024
num_repeats: 1
learning_rate: 0.0001
warmup_ratio: 0.1
fp16: false
gradient_accumulation_steps: 9
balance_malicious_batches: true
malicious_label_name: "True Positive - Malicious"
class_weight_mode: null
clf_loss_factor: 1.0
sim_loss_factor: 0.5
inference_type: clf
early_stopping_patience: 5
metric_for_best_model: eval_accuracy
greater_is_better: true
