# Production-tenant recipe (private data not released). Runs on any split in the same JSONL format.
# k=5 nearest neighbours over frozen SecureBERT 2.0 embeddings (cosine).
model_type: knn
preprocessor_kwargs:
  model_name: "cisco-ai/SecureBERT2.0-biencoder"
  max_tokens: 1024
  apply_weighting: false

embedding_model: "cisco-ai/SecureBERT2.0-biencoder"
k_neighbors: 5
metric: cosine
