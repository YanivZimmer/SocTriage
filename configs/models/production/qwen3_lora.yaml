# Production-tenant recipe (private data not released). Runs on any split in the same JSONL format.
# The tiny local decision model ("Tiny Decision" in the paper): Qwen3-0.6B-Base with LoRA as a sequence
# classifier with a trained score head, FP32.
model_type: qwen_lora
preprocessor_kwargs:
  model_name: "Qwen/Qwen3-0.6B-Base"
  max_tokens: 1024
  apply_weighting: false

model_name: "Qwen/Qwen3-0.6B-Base"
use_lora: true
num_train_epochs: 50
per_device_train_batch_size: 2
per_device_eval_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 0.0002
max_seq_length: 1024
lora_r: 16
lora_alpha: 32
lora_dropout: 0.1
target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
fp16: false
gradient_checkpointing: true
