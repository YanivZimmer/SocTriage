# Production-tenant recipe (private data not released). Runs on any split in the same JSONL format.
# SetFit with a LoRA adapter on MPNet attention projections.
model_type: setfit
preprocessor_kwargs:
  model_name: "sentence-transformers/paraphrase-mpnet-base-v2"
  max_tokens: 1024
  apply_weighting: false

model_name: "sentence-transformers/paraphrase-mpnet-base-v2"
num_train_epochs: 5
batch_size: 16
num_iterations: 20
learning_rate: 0.00002
seed: 42

use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.1
lora_target_modules: ["q", "k", "v", "o"]
